name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only throwaway credentials for the service containers below.
  DATABASE_URL: postgresql://knowguard:knowguard_ci@localhost:5432/knowguard_test?schema=public
  TEST_DATABASE_URL: postgresql://knowguard:knowguard_ci@localhost:5432/knowguard_test?schema=public
  REDIS_URL: redis://localhost:6379
  API_URL: http://localhost:4000
  LOG_LEVEL: warn
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowguard
          POSTGRES_PASSWORD: knowguard_ci
          POSTGRES_DB: knowguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowguard -d knowguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      - name: Apply migrations to test database
        run: pnpm db:test:prepare

      - name: Integration and API e2e tests
        run: pnpm test:e2e

      - name: Install Playwright browser
        run: pnpm --filter @knowguard/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
