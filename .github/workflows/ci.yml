name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI-only throwaway credentials for the service containers below.
  DATABASE_URL: postgresql://knowguard:knowguard_ci@localhost:5432/knowguard_test?schema=public
  TEST_DATABASE_URL: postgresql://knowguard:knowguard_ci@localhost:5432/knowguard_test?schema=public
  REDIS_URL: redis://localhost:6379
  API_URL: http://localhost:4000
  LOG_LEVEL: warn
  STORAGE_ENDPOINT: http://localhost:8333
  STORAGE_REGION: us-east-1
  STORAGE_BUCKET: knowguard-ci
  STORAGE_ACCESS_KEY_ID: knowguard_ci
  STORAGE_SECRET_ACCESS_KEY: knowguard_ci_secret
  STORAGE_FORCE_PATH_STYLE: 'true'
  STORAGE_AUTO_CREATE_BUCKET: 'true'
  # Local embedding model (ADR 0009); cached between runs by the step below.
  EMBEDDING_MODEL: Xenova/bge-small-en-v1.5
  RERANKER_MODEL: Xenova/bge-reranker-base
  QUEUE_PREFIX: knowguard-ci
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: knowguard
          POSTGRES_PASSWORD: knowguard_ci
          POSTGRES_DB: knowguard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowguard -d knowguard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/knowguard/models
          key: models-${{ env.EMBEDDING_MODEL }}-${{ env.RERANKER_MODEL }}

      # Fails fast, before anything else runs, if a credential was committed (ADR 0013).
      - name: Secret scan
        run: pnpm security:secrets

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # High or critical advisories in production dependencies fail the build.
      - name: Dependency audit
        run: pnpm security:audit

      - name: Build
        run: pnpm build

      # Nothing server-side (env names, secret values, credentials) may reach the browser bundle.
      - name: Browser bundle check
        run: pnpm --filter @knowguard/web check:bundle

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test

      # Service containers can't take a command, so SeaweedFS (S3-compatible) is started here.
      - name: Start object storage
        run: |
          docker run -d --name object-storage -p 8333:8333             -e AWS_ACCESS_KEY_ID="$STORAGE_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$STORAGE_SECRET_ACCESS_KEY"             chrislusf/seaweedfs:4.48 server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
          for i in $(seq 1 45); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333/ || true)
            if [ "$code" = "403" ]; then echo "object storage ready"; exit 0; fi
            sleep 2
          done
          docker logs object-storage
          exit 1

      - name: Apply migrations to test database
        run: pnpm db:test:prepare

      - name: Check schema drift
        run: pnpm db:check-drift

      - name: Integration and API e2e tests
        run: pnpm test:e2e

      - name: Install Playwright browser
        run: pnpm --filter @knowguard/web exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:browser

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
