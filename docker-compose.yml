# Local infrastructure for KnowGuard. Application processes run on the host via `pnpm dev`.
name: knowguard

services:
  postgres:
    # pgvector image so Phase 6 (embeddings) needs no infrastructure change.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}',
        '--appendonly',
        'yes',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  object-storage:
    # S3-compatible object storage for local development (SeaweedFS, Apache-2.0). MinIO no
    # longer publishes container images. Credentials from .env; anonymous access is denied.
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ['server', '-dir=/data', '-s3', '-s3.port=8333', '-ip.bind=0.0.0.0']
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:?set STORAGE_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:?set STORAGE_SECRET_ACCESS_KEY in .env}
    ports:
      - '127.0.0.1:${STORAGE_PORT:-8333}:8333'
    volumes:
      - object-storage-data:/data
    healthcheck:
      # Any HTTP answer (403 for anonymous) means the S3 gateway is up.
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 403 || wget -q --spider http://127.0.0.1:8333/',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  object-storage-data:
