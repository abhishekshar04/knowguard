packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency lifecycle scripts by default. Only these are allowed to run.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver
