packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency lifecycle scripts by default. Only these are allowed to run.
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@parcel/watcher'
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - prisma
  - sharp
  - unrs-resolver

# Security overrides for transitive dependencies (checked by `pnpm audit` in CI).
overrides:
  # GHSA-ggr8-5vv4-36mx (stack exhaustion), via prisma > @prisma/config. 8.x keeps the same API.
  deepmerge-ts: ^8.0.2
